<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timesheet App</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- PWA Manifest & Theme Color for Mobile Home Screen Icon -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e90ff">
</head>
<body>

<header>
  <h1>Timesheet</h1>
  <div style="display: flex; align-items: center; gap: 4px;">
    <input type="text" id="searchInput" placeholder="Search..." style="padding: 0.3rem; border-radius: 4px; border: none; outline: none; width: 65px; font-size: 0.8rem;">
    <select id="monthFilter" style="padding: 0.3rem; border-radius: 4px; border: none; outline: none; font-size: 0.8rem;"></select>
    <button id="openStats" style="background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 2px;" title="Statistics">📊</button>
    <button id="toggleDarkMode" style="background: transparent; border: none; font-size: 1.1rem; cursor: pointer; padding: 2px;" title="Toggle Dark Mode">🌙</button>
    <button id="openSettings" style="background: transparent; border: none; font-size: 1.1rem; cursor: pointer; color: white; padding: 2px;" title="Settings">⚙️</button>
  </div>
</header>

<main>
  <!-- Dashboard -->
  <div id="dashboard" class="dashboard">
    <div class="dashboard-item"><p>Total Hours</p><p id="totalHours">0</p></div>
    <div class="dashboard-item"><p>Total Gross</p><p>$<span id="totalGross">0</span></p></div>
    <div class="dashboard-item"><p>Total Net</p><p>$<span id="totalNet">0</span></p></div>
    <div class="dashboard-item"><p>Total CPF</p><p>$<span id="totalCPF">0</span></p></div>
  </div>

  <!-- Clear All button -->
  <div class="clear-container">
    <button id="clearAll">Clear All</button>
  </div>

  <div class="backup-container">
    <button id="exportData">Backup</button>
    <button id="importData">Restore</button>
    <button id="exportCSV">CSV</button>
    <input type="file" id="importFile" accept=".json" hidden>
  </div>

  <!-- Entries container -->
  <div id="entries"></div>
</main>

<!-- Floating Action Button -->
<button id="fab" class="fab">+</button>

<!-- Modal for adding/editing entry -->
<div id="entryModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeEntry">&times;</span>
    <h2 id="modalTitle">Add Entry</h2>
    <form id="timesheetForm">
      <div class="input-group">
        <input type="date" id="dateWorked" placeholder=" " required>
        <label for="dateWorked">Date Worked</label>
      </div>

      <div class="input-group">
        <select id="branch" required>
          <!-- Populated dynamically -->
        </select>
        <label for="branch">Branch</label>
      </div>

      <div class="input-group">
        <input type="time" id="timeIn" placeholder=" " required>
        <label for="timeIn">Time In</label>
      </div>

      <div class="input-group">
        <input type="time" id="timeOut" placeholder=" " required>
        <label for="timeOut">Time Out</label>
      </div>

      <button type="submit">Add Entry</button>
    </form>
  </div>
</div>

<!-- Modal for Settings -->
<div id="settingsModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeSettings">&times;</span>
    <h2>Settings</h2>
    <form id="settingsForm">
      <div class="input-group">
        <input type="number" id="setHourlyRate" step="0.5" placeholder=" " required>
        <label for="setHourlyRate">Hourly Rate ($)</label>
      </div>
      <div class="input-group">
        <input type="number" id="setEmployeeCpf" step="1" placeholder=" " required>
        <label for="setEmployeeCpf">Employee CPF Deduction (%)</label>
      </div>
      <div class="input-group">
        <input type="number" id="setEmployerCpf" step="1" placeholder=" " required>
        <label for="setEmployerCpf">Employer CPF Contribution (%)</label>
      </div>
      <div class="input-group">
        <input type="text" id="setBranches" placeholder=" " required>
        <label for="setBranches">Branches (comma separated)</label>
      </div>
      <button type="submit">Save Settings</button>
    </form>
  </div>
</div>

<!-- Modal for Statistics -->
<div id="statsModal" class="modal">
  <div class="modal-content">
    <span class="close" id="closeStats">&times;</span>
    <h2>Statistics</h2>
    <div id="statsContainer">
      <!-- Populated dynamically -->
    </div>
  </div>
</div>

<!-- Toast Notification -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .catch(err => console.log('Service Worker failed', err));
    });
  }
</script>

</body>
</html>
